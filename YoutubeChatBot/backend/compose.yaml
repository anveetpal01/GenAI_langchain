services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ytchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt -d ytchat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: yt-chatbot-api:dev
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://yt:${POSTGRES_PASSWORD}@db:5432/ytchat
    volumes:
      - yt-models:/models
      - yt-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  yt-models:
    name: yt-models
  yt-data:
    name: yt-data