name: yt-chatbot CI

on:
  push:
    branches: [main]
    paths: ["YoutubeChatBot/**", ".github/workflows/yt-chatbot-ci.yml"]
  pull_request:
    paths: ["YoutubeChatBot/**", ".github/workflows/yt-chatbot-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YoutubeChatBot/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: YoutubeChatBot/backend/requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  extension-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YoutubeChatBot/extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: YoutubeChatBot/extension/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: YoutubeChatBot/backend
          push: false
          tags: yt-chatbot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max